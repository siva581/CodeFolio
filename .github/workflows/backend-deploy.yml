name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "package.json"
      - "Dockerfile.backend"
      - ".github/workflows/backend-deploy.yml"
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7-alpine
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --workspaces

      - name: Run linter (if available)
        run: npm run lint --prefix backend || true

      - name: Build backend
        run: npm run build --prefix backend || true

      - name: Run tests (if available)
        run: npm test --prefix backend || true
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/test_db
          JWT_SECRET: test_secret
