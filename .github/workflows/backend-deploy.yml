name: Build and Deploy Backend

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "package.json"
      - "Dockerfile.backend"
      - ".github/workflows/backend-deploy.yml"
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7-alpine
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --workspaces

      - name: Run linter (if available)
        run: npm run lint --prefix backend || true

      - name: Build backend
        run: npm run build --prefix backend || true

      - name: Run tests (if available)
        run: npm test --prefix backend || true
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/test_db
          JWT_SECRET: test_secret

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/codefolio-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/codefolio-backend:${{ github.sha }}

      - name: Deploy to Render/Railway (if configured)
        run: |
          echo "Configure your deployment service credentials in GitHub Secrets"
          echo "Services: Render, Railway, Heroku, AWS, Azure App Service, etc."
